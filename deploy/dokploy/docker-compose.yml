# Dokploy (Compose application, or the template in this folder). Dokploy's Traefik terminates HTTPS, so there is no
# proxy here.
#
# In Dokploy: Create Service -> Compose -> paste this file -> Environment tab: set the variables below ->
# Domains tab: add your domain, service `kuukura`, port 8080, HTTPS on (Let's Encrypt).
#
# Variables (Environment tab):
#   VAULT_DOMAIN               vault.example.com           (the same domain you add in the Domains tab)
#   VAULT_OIDC_CLIENT_ID       000000000000-example.apps.googleusercontent.com
#   VAULT_OIDC_CLIENT_SECRET   the Google OAuth client secret
#   VAULT_TRUSTED_PROXIES      optional: `cloudflare` (or CIDRs) when a CDN or load balancer with public addresses is in front
#                              of Traefik, so the audit log sees the real client IP; then add it under environment below
#   KUUKURA_VERSION            a release tag (YEAR.MONTH.N, see the releases page); default `latest`, pin one in production
#
# The master key is generated on the first start and kept in the `kuukura-keys` volume, apart from the database
# in `kuukura-data`. After the first start, open a terminal in the container and run `ku-server key show` once:
# store the key in your password manager (docs/deploy.md). The OAuth client secret is an environment variable:
# anyone who can read this service's environment (Dokploy admins, `docker inspect`) can read it.
services:
  kuukura:
    image: ghcr.io/victorlunam/kuukura:${KUUKURA_VERSION:-latest}
    restart: unless-stopped
    environment:
      VAULT_DOMAIN: ${VAULT_DOMAIN}
      VAULT_STORAGE: sqlite
      VAULT_SQLITE_PATH: /data/kuukura.db
      VAULT_KEY_PROVIDER: manual
      VAULT_MASTER_KEY_FILE: /keys/master_key
      VAULT_MASTER_KEY_GENERATE: "true"
      VAULT_OIDC_CLIENT_ID: ${VAULT_OIDC_CLIENT_ID}
      VAULT_OIDC_CLIENT_SECRET: ${VAULT_OIDC_CLIENT_SECRET}
      # VAULT_TRUSTED_PROXIES: cloudflare  # behind Cloudflare's proxy: real client IP in the audit log (docs/deploy.md)
    volumes:
      - kuukura-data:/data
      - kuukura-keys:/keys
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "/ku-server", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  kuukura-data:
  kuukura-keys:
