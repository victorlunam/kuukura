# Dokploy (Compose application). Dokploy's Traefik terminates HTTPS, so there is no proxy here.
#
# In Dokploy: Create Service -> Compose -> paste this file -> Environment tab: set the variables below ->
# Domains tab: add your domain, service `kuukura`, port 8080, HTTPS on (Let's Encrypt).
#
# Variables (Environment tab):
#   VAULT_DOMAIN               vault.example.com           (the same domain you add in the Domains tab)
#   VAULT_MASTER_KEY           the key file body, e.g. 1:BASE64...  (create it with `ku-server init`, see docs/deploy.md)
#   VAULT_OIDC_CLIENT_ID       000000000000-example.apps.googleusercontent.com
#   VAULT_OIDC_CLIENT_SECRET   the Google OAuth client secret
#   KUUKURA_VERSION            e.g. 2026.10.0   (pin a release; avoid `latest` in production)
#
# Dokploy has no Docker secret files, so the master key and client secret are environment variables: anyone who can
# read this service's environment (Dokploy admins, `docker inspect`) can read them. Keep the offline copy of the key.
services:
  kuukura:
    image: ghcr.io/victorlunam/kuukura:${KUUKURA_VERSION:-latest}
    restart: unless-stopped
    environment:
      VAULT_DOMAIN: ${VAULT_DOMAIN}
      VAULT_STORAGE: sqlite
      VAULT_SQLITE_PATH: /data/kuukura.db
      VAULT_KEY_PROVIDER: manual
      VAULT_MASTER_KEY: ${VAULT_MASTER_KEY}
      VAULT_OIDC_CLIENT_ID: ${VAULT_OIDC_CLIENT_ID}
      VAULT_OIDC_CLIENT_SECRET: ${VAULT_OIDC_CLIENT_SECRET}
    volumes: [kuukura-data:/data]
    expose: ["8080"]

volumes:
  kuukura-data:
