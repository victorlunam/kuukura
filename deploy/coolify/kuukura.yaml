# documentation: https://github.com/victorlunam/kuukura/blob/main/docs/deploy.md
# slogan: Self-hosted secrets vault for small teams, with an audit log and confirmations by passkey.
# category: security
# tags: secrets,vault,security,encryption,self-hosted
# logo: svgs/kuukura.svg
# port: 8080

# Coolify service template. The master key is generated on the first start and kept in the kuukura-keys volume,
# apart from the database in kuukura-data. After the first deploy open the service's terminal and run
# `/ku-server key show` once; store the key in your password manager.
# Before deploying, create a Google OAuth client (type "Web application") with the redirect URI
# https://<the domain Coolify assigns>/auth/callback and fill the two OIDC variables.
services:
  kuukura:
    image: ghcr.io/victorlunam/kuukura:${KUUKURA_VERSION:-latest}
    environment:
      - SERVICE_FQDN_KUUKURA_8080
      - VAULT_DOMAIN=${SERVICE_FQDN_KUUKURA}
      - VAULT_STORAGE=sqlite
      - VAULT_SQLITE_PATH=/data/kuukura.db
      - VAULT_KEY_PROVIDER=manual
      - VAULT_MASTER_KEY_FILE=/keys/master_key
      - VAULT_MASTER_KEY_GENERATE=true
      - VAULT_OIDC_CLIENT_ID=${VAULT_OIDC_CLIENT_ID:?}
      - VAULT_OIDC_CLIENT_SECRET=${VAULT_OIDC_CLIENT_SECRET:?}
    volumes:
      - kuukura-data:/data
      - kuukura-keys:/keys
    healthcheck:
      test: ["CMD", "/ku-server", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  kuukura-data:
  kuukura-keys:
