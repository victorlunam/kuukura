# Render Blueprint: deploy kuukura from the published image with one persistent disk for the SQLite database.
# Render terminates HTTPS. On Render the master key lives in Render's environment (VAULT_MASTER_KEY, generated once):
# read it from the service's Environment tab and store a copy in your password manager (docs/deploy.md).
# `image.url` follows `latest`; for production replace it with a release tag (see docs/deploy.md). Render asks for
# the `sync: false` values (VAULT_DOMAIN and the two OIDC values) when the Blueprint is created. VAULT_DOMAIN is the
# domain the service is served on (the onrender.com name, or your custom domain); change it in the Environment tab
# if you add a custom domain. Render's default port is 10000, so VAULT_ADDR listens there.
services:
  - type: web
    name: kuukura
    runtime: image
    image:
      url: ghcr.io/victorlunam/kuukura:latest
    plan: 0.5c-512mb
    healthCheckPath: /healthz
    disk:
      name: kuukura-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: VAULT_DOMAIN
        sync: false
      - key: VAULT_ADDR
        value: ":10000"
      - key: VAULT_STORAGE
        value: sqlite
      - key: VAULT_SQLITE_PATH
        value: /data/kuukura.db
      - key: VAULT_KEY_PROVIDER
        value: manual
      - key: VAULT_MASTER_KEY
        generateValue: true
      - key: VAULT_OIDC_CLIENT_ID
        sync: false
      - key: VAULT_OIDC_CLIENT_SECRET
        sync: false
      # - key: VAULT_TRUSTED_PROXIES  # behind Cloudflare's proxy: value cloudflare, for the real client IP (docs/deploy.md)
      #   value: cloudflare
