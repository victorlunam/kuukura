# Render Blueprint: deploy kuukura from the published image with one persistent disk for the SQLite database.
# Render terminates HTTPS. On Render the master key lives in Render's environment (VAULT_MASTER_KEY, generated once):
# read it from the service's Environment tab and store a copy in your password manager (docs/deploy.md).
# Pin a release in `image.url`; the OIDC values are asked for when the Blueprint is created. Set VAULT_DOMAIN to
# the domain the service is served on (the onrender.com name, or your custom domain) after the first deploy.
services:
  - type: web
    name: kuukura
    runtime: image
    image:
      url: ghcr.io/victorlunam/kuukura:2026.10.0
    plan: starter
    healthCheckPath: /healthz
    disk:
      name: kuukura-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: VAULT_DOMAIN
        sync: false
      - key: VAULT_STORAGE
        value: sqlite
      - key: VAULT_SQLITE_PATH
        value: /data/kuukura.db
      - key: VAULT_KEY_PROVIDER
        value: manual
      - key: VAULT_MASTER_KEY
        generateValue: true
      - key: VAULT_OIDC_CLIENT_ID
        sync: false
      - key: VAULT_OIDC_CLIENT_SECRET
        sync: false
