name: Feature request
description: Suggest an improvement
labels: ["feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe your situation before the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: clean
    attributes:
      label: Before submitting
      options:
        - label: I did not include any real secret value or token.
          required: true
