name: release
# Tag a release as vYEAR.MONTH.N (e.g. v2026.10.0). The tag builds and publishes the image and the CLI binaries;
# nothing is built on the servers that run kuukura.
on:
  push:
    tags: ["v[0-9][0-9][0-9][0-9].[0-9]*.[0-9]*"]

permissions:
  contents: write
  packages: write

jobs:
  checks:
    # never publish from a red tree: same gates as ci.yml
    uses: ./.github/workflows/ci.yml

  image:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          full="${GITHUB_REF_NAME#v}"            # 2026.10.0
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "minor=${full%.*}" >> "$GITHUB_OUTPUT"   # 2026.10
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.v.outputs.full }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.v.outputs.full }}
            ghcr.io/${{ github.repository }}:${{ steps.v.outputs.minor }}
            ghcr.io/${{ github.repository }}:latest

  cli:
    needs: checks
    strategy:
      matrix:
        include:
          # the CLI needs cgo on macOS (Keychain), so it is built on a mac runner
          - { os: macos-14, goos: darwin, goarch: arm64 }
          - { os: macos-13, goos: darwin, goarch: amd64 }
          - { os: ubuntu-latest, goos: linux, goarch: amd64 }
          - { os: ubuntu-latest, goos: linux, goarch: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          full="${GITHUB_REF_NAME#v}"
          mkdir -p out
          go build -trimpath -ldflags "-s -w -X main.version=$full" -o out/kuukura ./cmd/ku
          tar -C out -czf "kuukura_${full}_${GOOS}_${GOARCH}.tar.gz" kuukura
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: kuukura_*.tar.gz

  publish:
    needs: [image, cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          merge-multiple: true
      - run: sha256sum kuukura_*.tar.gz > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            kuukura_*.tar.gz
            checksums.txt
          generate_release_notes: true
