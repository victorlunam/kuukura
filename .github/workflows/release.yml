name: release
# Tag a release as vYEAR.MONTH.N (e.g. v2026.10.0). The tag builds and publishes the image and the CLI binaries;
# nothing is built on the servers that run kuukura.
on:
  push:
    tags: ["v[0-9][0-9][0-9][0-9].[0-9]*.[0-9]*"]

permissions:
  contents: write
  packages: write

jobs:
  checks:
    # never publish from a red tree: same gates as ci.yml
    uses: ./.github/workflows/ci.yml

  image:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          full="${GITHUB_REF_NAME#v}"            # 2026.10.0
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "minor=${full%.*}" >> "$GITHUB_OUTPUT"   # 2026.10
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.v.outputs.full }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.v.outputs.full }}
            ghcr.io/${{ github.repository }}:${{ steps.v.outputs.minor }}
            ghcr.io/${{ github.repository }}:latest

  cli:
    needs: checks
    strategy:
      matrix:
        include:
          # macOS needs cgo (the Keychain), so it is built on a mac runner (clang builds both architectures).
          # Linux and Windows are pure Go (Secret Service / Credential Manager without cgo) and cross-build anywhere.
          - { os: macos-latest, goos: darwin, goarch: arm64, cgo: "1" }
          - { os: macos-latest, goos: darwin, goarch: amd64, cgo: "1" }
          - { os: ubuntu-latest, goos: linux, goarch: amd64, cgo: "0" }
          - { os: ubuntu-latest, goos: linux, goarch: arm64, cgo: "0" }
          - { os: ubuntu-latest, goos: windows, goarch: amd64, cgo: "0" }
          - { os: ubuntu-latest, goos: windows, goarch: arm64, cgo: "0" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
          # Optional: a Developer ID certificate (base64 .p12) signs the macOS binary, so the Keychain recognises it
          # across versions. Without these secrets the binary is shipped unsigned (scripts/sign-macos.sh signs later).
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          full="${GITHUB_REF_NAME#v}"
          ext=""; [ "$GOOS" = "windows" ] && ext=".exe"
          mkdir -p out
          go build -trimpath -ldflags "-s -w -X main.version=$full" -o "out/kuukura$ext" ./cmd/ku
          if [ "$GOOS" = "darwin" ] && [ -n "$MACOS_CERT_P12" ]; then
            kc="$RUNNER_TEMP/sign.keychain-db"; pw="$(uuidgen)"
            echo "$MACOS_CERT_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
            security create-keychain -p "$pw" "$kc"
            security set-keychain-settings -lut 900 "$kc"
            security unlock-keychain -p "$pw" "$kc"
            security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc" >/dev/null
            security list-keychains -d user -s "$kc" login.keychain
            id="$(security find-identity -v -p codesigning "$kc" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
            codesign --force --options runtime --timestamp -s "$id" out/kuukura
            codesign --verify --strict out/kuukura
            rm -f "$RUNNER_TEMP/cert.p12"
          fi
          cp "out/kuukura$ext" "out/ku$ext"   # the documented short name
          if [ "$GOOS" = "windows" ]; then
            (cd out && zip -q "../kuukura_${full}_${GOOS}_${GOARCH}.zip" "kuukura$ext" "ku$ext")
          else
            tar -C out -czf "kuukura_${full}_${GOOS}_${GOARCH}.tar.gz" kuukura ku
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            kuukura_*.tar.gz
            kuukura_*.zip
          if-no-files-found: error

  publish:
    needs: [image, cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          merge-multiple: true
      - run: sha256sum kuukura_*.tar.gz kuukura_*.zip > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            kuukura_*.tar.gz
            kuukura_*.zip
            checksums.txt
          generate_release_notes: true
