name: release
# Tag a release as vYEAR.MONTH.N. The tag is the version: it builds and publishes the image and the CLI binaries;
# nothing is built on the servers that run kuukura. Every artifact carries build provenance, the image is also
# signed (keyless cosign) and has an SBOM: docs/deploy.md shows how to verify them.
on:
  push:
    tags: ["v[0-9][0-9][0-9][0-9].[0-9]*.[0-9]*"]

permissions:
  contents: read

jobs:
  checks:
    # never publish from a red tree: same gates as ci.yml
    uses: ./.github/workflows/ci.yml

  image:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing and attestation
      attestations: write
      artifact-metadata: write # storage record of the pushed image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        run: |
          full="${GITHUB_REF_NAME#v}"            # YEAR.MONTH.N
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "minor=${full%.*}" >> "$GITHUB_OUTPUT"   # YEAR.MONTH
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.v.outputs.full }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.v.outputs.full }}
            ghcr.io/${{ github.repository }}:${{ steps.v.outputs.minor }}
            ghcr.io/${{ github.repository }}:latest
      # Everything below names the image by digest, never by tag: a tag can move, the digest cannot.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image (keyless)
        run: cosign sign --yes "ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: kuukura-image.spdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: kuukura-image.spdx.json
          if-no-files-found: error

  cli:
    needs: checks
    strategy:
      matrix:
        include:
          # macOS needs cgo (the Keychain), so it is built on a mac runner (clang builds both architectures).
          # Linux and Windows are pure Go (Secret Service / Credential Manager without cgo) and cross-build anywhere.
          - { os: macos-latest, goos: darwin, goarch: arm64, cgo: "1" }
          - { os: macos-latest, goos: darwin, goarch: amd64, cgo: "1" }
          - { os: ubuntu-latest, goos: linux, goarch: amd64, cgo: "0" }
          - { os: ubuntu-latest, goos: linux, goarch: arm64, cgo: "0" }
          - { os: ubuntu-latest, goos: windows, goarch: amd64, cgo: "0" }
          - { os: ubuntu-latest, goos: windows, goarch: arm64, cgo: "0" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
          # Optional: a Developer ID certificate (base64 .p12) signs the macOS binary, so the Keychain recognises it
          # across versions. Without these secrets the binary is shipped unsigned (scripts/sign-macos.sh signs later).
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          full="${GITHUB_REF_NAME#v}"
          ext=""; [ "$GOOS" = "windows" ] && ext=".exe"
          mkdir -p out
          go build -trimpath -ldflags "-s -w -X main.version=$full" -o "out/kuukura$ext" ./cmd/ku
          if [ "$GOOS" = "darwin" ] && [ -n "$MACOS_CERT_P12" ]; then
            kc="$RUNNER_TEMP/sign.keychain-db"; pw="$(uuidgen)"
            echo "$MACOS_CERT_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
            security create-keychain -p "$pw" "$kc"
            security set-keychain-settings -lut 900 "$kc"
            security unlock-keychain -p "$pw" "$kc"
            security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc" >/dev/null
            security list-keychains -d user -s "$kc" login.keychain
            id="$(security find-identity -v -p codesigning "$kc" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
            codesign --force --options runtime --timestamp -s "$id" out/kuukura
            codesign --verify --strict out/kuukura
            rm -f "$RUNNER_TEMP/cert.p12"
          fi
          cp "out/kuukura$ext" "out/ku$ext"   # the documented short name
          if [ "$GOOS" = "windows" ]; then
            (cd out && zip -q "../kuukura_${full}_${GOOS}_${GOARCH}.zip" "kuukura$ext" "ku$ext")
          else
            tar -C out -czf "kuukura_${full}_${GOOS}_${GOARCH}.tar.gz" kuukura ku
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            kuukura_*.tar.gz
            kuukura_*.zip
          if-no-files-found: error

  publish:
    needs: [image, cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
      - run: sha256sum kuukura_*.tar.gz kuukura_*.zip > checksums.txt
      # The archives are the bytes the cli jobs built; the checksums name each one as a subject.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: checksums.txt
      # The release text starts with this version's CHANGELOG.md section (empty if there is none); GitHub's generated
      # notes (pull requests, contributors) follow it.
      - name: Release notes from CHANGELOG.md
        run: |
          full="${GITHUB_REF_NAME#v}"
          awk -v h="## [$full]" 'index($0, h) == 1 { on = 1; next } /^## \[/ { on = 0 } on' CHANGELOG.md > release-notes.md
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            kuukura_*.tar.gz
            kuukura_*.zip
            checksums.txt
            kuukura-image.spdx.json
          body_path: release-notes.md
          generate_release_notes: true

  homebrew:
    # Updates the formula in victorlunam/homebrew-tap: `brew install victorlunam/tap/kuukura`.
    # Needs the repository secret HOMEBREW_TAP_DEPLOY_KEY (an SSH key with write access to that repository).
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: victorlunam/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap
      - name: Render and push the formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          full="${GITHUB_REF_NAME#v}"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern checksums.txt
          mkdir -p tap/Formula
          sh scripts/homebrew/render.sh "$full" checksums.txt > tap/Formula/kuukura.rb
          cd tap
          git add Formula/kuukura.rb
          if git diff --cached --quiet; then echo "formula already at $full"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "kuukura $full"
          git push
