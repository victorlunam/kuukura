name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # reused by release.yml so a tag is never published from a red tree

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true
      - run: go vet ./...
      # Tool versions are pinned so a new release cannot turn the tree red on its own; Dependabot does not track
      # these, bump them by hand.
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - run: go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # Two legs, so the sqlite one does not wait for (or start) a Postgres service. Fuzzing runs once, in the sqlite leg:
  # it touches no database.
  test-sqlite:
    runs-on: ubuntu-latest
    env:
      VAULT_STORAGE: sqlite
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true
      - run: go test -race ./...
      - name: Fuzz (short)
        run: go test ./internal/keys -run '^$' -fuzz FuzzOpen -fuzztime 20s

  test-postgres:
    runs-on: ubuntu-latest
    env:
      VAULT_STORAGE: postgres
      VAULT_TEST_POSTGRES_URL: postgres://kuukura:kuukura@localhost:5432/kuukura?sslmode=disable
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kuukura
          POSTGRES_PASSWORD: kuukura
          POSTGRES_DB: kuukura
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kuukura"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true
      - run: go test -race ./...

  # The CLI runs on macOS, Linux and Windows. Every OS builds and vets it; the tests that depend on `sh` run on
  # macOS and Linux, and the OS-specific ones (real keychain, config location, browser command) run everywhere.
  cli-os:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      VAULT_STORAGE: sqlite
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true
      - run: go build ./cmd/ku
      - run: go vet ./cmd/ku
      - name: Tests (macOS, Linux)
        if: runner.os != 'Windows'
        run: go test -count=1 ./cmd/ku
      - name: Tests that are portable (Windows)
        if: runner.os == 'Windows'
        run: go test -count=1 ./cmd/ku -run "SessionStore|SystemStore|ConfigRoot|ConfigDir|OpenCommand|ProfileNames|ProfileResolution|SignedIn"

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t kuukura:ci .
