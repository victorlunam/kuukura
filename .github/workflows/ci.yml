name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # reused by release.yml so a tag is never published from a red tree

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - run: go run github.com/securego/gosec/v2/cmd/gosec@latest ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        storage: [sqlite, postgres]
    env:
      VAULT_STORAGE: ${{ matrix.storage }}
      VAULT_TEST_POSTGRES_URL: postgres://kuukura:kuukura@localhost:5432/kuukura?sslmode=disable
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kuukura
          POSTGRES_PASSWORD: kuukura
          POSTGRES_DB: kuukura
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kuukura"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true
      - run: go test -race ./...
      - name: Fuzz (short)
        run: |
          go test ./keys -run '^$' -fuzz FuzzParseAAD -fuzztime 20s
          go test ./keys -run '^$' -fuzz FuzzOpen -fuzztime 20s

  # The CLI runs on macOS, Linux and Windows. Every OS builds and vets it; the tests that depend on `sh` run on
  # macOS and Linux, and the OS-specific ones (real keychain, config location, browser command) run everywhere.
  cli-os:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      VAULT_STORAGE: sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true
      - run: go build ./cmd/ku
      - run: go vet ./cmd/ku
      - name: Tests (macOS, Linux)
        if: runner.os != 'Windows'
        run: go test -count=1 ./cmd/ku
      - name: Tests that are portable (Windows)
        if: runner.os == 'Windows'
        run: go test -count=1 ./cmd/ku -run "SessionStore|SystemStore|ConfigRoot|ConfigDir|OpenCommand|ProfileNames|ProfileResolution|SignedIn"

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t kuukura:ci .
