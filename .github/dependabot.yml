version: 2
updates:
  # Workflow actions are pinned by commit SHA; Dependabot bumps the SHA and the version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  # The pnpm workspace (apps/web, packages/brand); one lockfile at the root.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # @astrojs/check supports TypeScript 5 and 6 only; lift this when it accepts 7
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  # Base images are pinned by digest; Dependabot bumps the digest with the tag.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
