version: 2
updates:
  # Workflow actions are pinned by commit SHA; Dependabot bumps the SHA and the version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  # Base images are pinned by digest; Dependabot bumps the digest with the tag.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
