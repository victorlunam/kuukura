<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none" role="img" aria-label="kuukura: a self-hosted secrets vault">
  <defs>
    <radialGradient id="glow" cx="78%" cy="30%" r="70%">
      <stop offset="0" stop-color="#14B8A6" stop-opacity=".28"/>
      <stop offset="1" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#fff" fill-opacity=".07"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#0B1220"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- empty open vault -->
  <g transform="translate(700 120)">
    <ellipse cx="260" cy="390" rx="210" ry="22" fill="#fff" fill-opacity=".05"/>
    <rect x="130" y="40" width="300" height="320" rx="44" fill="#111B2E" stroke="#fff" stroke-opacity=".9" stroke-width="7"/>
    <rect x="164" y="74" width="232" height="252" rx="26" fill="#0B1220"/>
    <rect x="214" y="150" width="132" height="100" rx="14" stroke="#fff" stroke-opacity=".35" stroke-width="4" stroke-dasharray="10 12"/>
    <path d="M130 62 L38 96 V306 L130 340 Z" fill="#111B2E" stroke="#fff" stroke-opacity=".9" stroke-width="7" stroke-linejoin="round"/>
    <ellipse cx="84" cy="201" rx="14" ry="38" stroke="#fff" stroke-opacity=".9" stroke-width="7"/>
    <circle cx="84" cy="201" r="7" fill="#F5A524"/>
    <path d="M470 70l8 18 18 8-18 8-8 18-8-18-18-8 18-8z" fill="#F5A524"/>
    <circle cx="520" cy="170" r="5" fill="#14B8A6"/>
    <circle cx="20" cy="60" r="4" fill="#14B8A6"/>
  </g>

  <!-- wordmark -->
  <g transform="translate(96 200)">
    <rect width="96" height="96" rx="24" fill="#0B1220" stroke="#fff" stroke-opacity=".2" stroke-width="2"/>
    <circle cx="48" cy="48" r="25.5" stroke="#fff" stroke-width="5.25"/>
    <circle cx="48" cy="48" r="12.75" stroke="#fff" stroke-opacity=".3" stroke-width="3" stroke-dasharray="4.5 6"/>
    <circle cx="48" cy="22.5" r="4.8" fill="#F5A524"/>
    <text x="128" y="68" fill="#fff" font-family="ui-rounded, 'SF Pro Rounded', 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="68" font-weight="700" letter-spacing="-1.5">kuukura</text>
  </g>
  <text x="96" y="396" fill="#fff" fill-opacity=".92" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="38" font-weight="600">Secrets for your team.</text>
  <text x="96" y="446" fill="#fff" fill-opacity=".6" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30">Self-hosted. Decrypted only on your server.</text>
</svg>
