<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="kuukura: secrets for your team, self-hosted">
  <defs>
    <radialGradient id="glow" cx="76%" cy="38%" r="60%">
      <stop offset="0" stop-color="#14B8A6" stop-opacity=".26"/>
      <stop offset="1" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#fff" fill-opacity=".07"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#0B1220"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- the empty vault, same drawing as the invite page (dark palette), scaled -->
  <g transform="translate(560 100) scale(2.55)" stroke-linejoin="round">
    <ellipse cx="128" cy="147" rx="80" ry="7" fill="#12302F"/>
    <path d="M206 30l3.2 7.8 7.8 3.2-7.8 3.2-3.2 7.8-3.2-7.8-7.8-3.2 7.8-3.2z" fill="#FBBF24"/>
    <circle cx="220" cy="84" r="3" fill="#2DD4BF"/>
    <circle cx="30" cy="40" r="2.5" fill="#2DD4BF"/>
    <rect x="104" y="135" width="16" height="7" rx="2.5" fill="#EEF2F7"/>
    <rect x="148" y="135" width="16" height="7" rx="2.5" fill="#EEF2F7"/>
    <rect x="82" y="30" width="104" height="106" rx="22" fill="#101827" stroke="#EEF2F7" stroke-width="2.5"/>
    <circle cx="134" cy="83" r="36" fill="#0A1F1F" stroke="#EEF2F7" stroke-width="2.5"/>
    <circle cx="134" cy="83" r="26" fill="#EEF2F7" fill-opacity=".08"/>
    <circle cx="134" cy="83" r="16" fill="#EEF2F7" fill-opacity=".1"/>
    <circle cx="134" cy="83" r="7" fill="#EEF2F7" fill-opacity=".14"/>
    <rect x="60" y="52" width="26" height="9" rx="3" fill="#EEF2F7"/>
    <rect x="60" y="105" width="26" height="9" rx="3" fill="#EEF2F7"/>
    <ellipse cx="60" cy="83" rx="12" ry="40" fill="#101827" stroke="#EEF2F7" stroke-width="2.5"/>
    <ellipse cx="60" cy="83" rx="6" ry="27" fill="#12302F"/>
    <circle cx="60" cy="83" r="3" fill="#FBBF24"/>
  </g>

  <!-- lockup -->
  <g transform="translate(96 190)">
    <rect width="104" height="104" rx="26" fill="#0B1220" stroke="#fff" stroke-opacity=".2" stroke-width="2"/>
    <circle cx="52" cy="52" r="30.9" fill="none" stroke="#fff" stroke-width="5.7"/>
    <path d="M52 34.2V52M66.8 61.3 52 52M37.2 61.3 52 52" fill="none" stroke="#fff" stroke-width="5.2" stroke-linecap="round"/>
    <circle cx="52" cy="52" r="6.8" fill="#F5A524"/>
    <text x="136" y="76" fill="#fff" font-family="ui-rounded, 'SF Pro Rounded', 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="76" font-weight="700" letter-spacing="-2">kuukura</text>
  </g>
  <text x="96" y="388" fill="#fff" fill-opacity=".94" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="40" font-weight="600">Secrets for your team.</text>
  <text x="96" y="440" fill="#fff" fill-opacity=".6" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30">Self-hosted. Decrypted only on your server.</text>
