<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="A shield with a vault dial">
  <style>
    :root{--ink:#0a1b20;--muted:#566870;--card:#fff;--soft:#e3f1ee;--hollow:#cde3df;--acc:#0e9384;--amber:#f5a524}
    @media (prefers-color-scheme:dark){:root{--ink:#e9f3f2;--muted:#8fa5aa;--card:#0c1d22;--soft:#0f2e2e;--hollow:#07201f;--acc:#2dd4bf;--amber:#fbbf24}}
    .s-ink{stroke:var(--ink)}.s-mut{stroke:var(--muted)}.s-acc{stroke:var(--acc)}.s-card{stroke:var(--card)}
    .f-ink{fill:var(--ink)}.f-card{fill:var(--card)}.f-soft{fill:var(--soft)}.f-hollow{fill:var(--hollow)}.f-acc{fill:var(--acc)}.f-amber{fill:var(--amber)}
  </style>
  <circle class="f-soft" cx="120" cy="80" r="62"/>
  <ellipse class="f-soft" cx="120" cy="147" rx="74" ry="6.5"/>
  <path class="f-amber" d="M192 33l3.2 7.8 7.8 3.2-7.8 3.2-3.2 7.8-3.2-7.8-7.8-3.2 7.8-3.2z"/>
  <circle class="f-acc" cx="50" cy="50" r="3"/>
  <circle class="f-acc" cx="198" cy="112" r="2.5"/>
  <!-- shield -->
  <path class="f-card" d="M120 20 166 37v38c0 29-19 49-46 61-27-12-46-32-46-61V37z"/>
  <path class="f-soft" d="M120 20 74 37v38c0 29 19 49 46 61z" opacity=".7"/>
  <path class="s-ink" d="M120 20 166 37v38c0 29-19 49-46 61-27-12-46-32-46-61V37z" fill="none" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- the dial: rim, eight bolts, hub (the mark) -->
  <circle class="s-ink" cx="120" cy="76" r="19" fill="none" stroke-width="3.4"/>
  <path class="s-ink" d="M120 65h0M120 87h0M109 76h0M131 76h0M112.22 68.22h0M127.78 68.22h0M112.22 83.78h0M127.78 83.78h0" fill="none" stroke-width="4" stroke-linecap="round"/>
  <circle class="f-amber" cx="120" cy="76" r="5"/>
</svg>
