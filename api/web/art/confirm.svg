<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="A fingerprint asking for confirmation">
  <style>
    :root{--ink:#0b1220;--muted:#5a6578;--card:#fff;--soft:#e6f4f1;--hollow:#d3e6e1;--acc:#0f9d8a;--amber:#f5a524}
    @media (prefers-color-scheme:dark){:root{--ink:#eef2f7;--muted:#94a0b3;--card:#101827;--soft:#12302f;--hollow:#0a1f1f;--acc:#2dd4bf;--amber:#fbbf24}}
    .s-ink{stroke:var(--ink)}.s-mut{stroke:var(--muted)}.s-acc{stroke:var(--acc)}.s-card{stroke:var(--card)}
    .f-ink{fill:var(--ink)}.f-card{fill:var(--card)}.f-soft{fill:var(--soft)}.f-hollow{fill:var(--hollow)}.f-acc{fill:var(--acc)}.f-amber{fill:var(--amber)}
  </style>
  <circle class="s-acc pulse" cx="120" cy="80" r="68" fill="none" stroke-width="2" stroke-dasharray="1 9" stroke-linecap="round"/>
  <circle class="f-soft" cx="120" cy="80" r="54"/>
  <circle class="f-card s-ink" cx="120" cy="80" r="40" stroke-width="2.5"/>
  <g class="s-acc" fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M102 98v-9a18 18 0 0 1 36 0v5"/>
    <path d="M110 103v-14a10 10 0 0 1 20 0v9"/>
    <path d="M118 105v-16a2 2 0 0 1 4 0v13"/>
    <path d="M94 88a26 26 0 0 1 52 0"/>
  </g>
  <path class="f-amber" d="M196 36l3.2 7.8 7.8 3.2-7.8 3.2-3.2 7.8-3.2-7.8-7.8-3.2 7.8-3.2z"/>
  <circle class="f-acc" cx="40" cy="48" r="3"/>
  <circle class="f-acc" cx="204" cy="112" r="2.5"/>
</svg>
